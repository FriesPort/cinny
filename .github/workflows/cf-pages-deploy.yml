name: Deploy to Cloudflare Pages

permissions:
  contents: read
  issues: write

on:
  push:
    branches:
      - fp-deploy
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20.12.2
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build

      - name: Remove .git folder
        run: |
          rm -rf .git

      - name: Deploy to Cloudflare Pages (preview)
        run: |
          npx wrangler pages deploy ./dist --project-name cinnyapp --branch preview

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-dist
          path: dist/
          retention-days: 1

  # NOTE: Manual approval is handled via GitHub Environments (recommended).
  # Create an environment named `production` in the repository settings
  # and add required reviewers there. The `deploy-production` job below
  # will be blocked by the environment until reviewers approve.

  deploy-production:
    needs: deploy-preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-dist
          path: dist/

      - name: Deploy to Cloudflare Pages (production)
        run: |
          npx wrangler pages deploy ./dist --project-name cinnyapp --branch main
